name: paper-trading

on:
  workflow_dispatch:
  schedule:
    # Weekdays after the US cash-market close. GitHub cron uses UTC.
    # Scheduled workflows can be delayed by GitHub; this is not a tick-by-tick system.
    - cron: "30 22 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-scout-ai-paper-trading
  cancel-in-progress: false

jobs:
  paper-trading:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated paper-trading cycle
        run: python -m runner.daily_runner

      - name: Persist paper portfolio database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stock_scout.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "chore: update paper portfolio state"
          git push origin HEAD:main
