name: intraday-paper-monitor

on:
  workflow_dispatch:
  schedule:
    # Run every 15 minutes during the US cash session.
    # 09:30 and then :45, plus every 15 minutes from 10:00 through 15:45,
    # and a final check at 16:00, in America/New_York time.
    # GitHub Actions may delay scheduled workflows under scheduler load.
    - cron: "30,45 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "*/15 10-15 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: stock-scout-ai-paper-portfolio
  cancel-in-progress: false

jobs:
  intraday-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Monitor open paper positions
        run: python -m runner.intraday_monitor

      - name: Persist paper portfolio database if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stock_scout.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "chore: update intraday paper portfolio state"
          git push origin HEAD:main
