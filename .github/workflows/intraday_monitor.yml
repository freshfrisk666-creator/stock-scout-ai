name: intraday-paper-monitor

on:
  workflow_dispatch:
  schedule:
    # Run every 15 minutes during the US cash session.
    # 09:30 and then :45, plus every 15 minutes from 10:00 through 15:45,
    # and a final check at 16:00, in America/New_York time.
    # GitHub Actions may delay scheduled workflows under scheduler load.
    - cron: "30,45 9 * * 1-5"
      timezone: "America/New_York"
    - cron: "*/15 10-15 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: write
  issues: write

concurrency:
  group: stock-scout-ai-paper-portfolio
  cancel-in-progress: false

jobs:
  intraday-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Monitor open paper positions
        id: monitor
        shell: bash
        run: |
          set -o pipefail
          python -m runner.intraday_monitor | tee intraday_monitor.log

          closed_count="$(grep -E '^Closed this cycle: [0-9]+$' intraday_monitor.log | tail -1 | awk '{print $4}')"
          closed_count="${closed_count:-0}"
          echo "closed_count=$closed_count" >> "$GITHUB_OUTPUT"

      - name: Notify trade closure
        if: steps.monitor.outputs.closed_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          title="Stock Scout AI — Paper Monitor Alerts"
          issue_url="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "$title in:title" \
            --json url \
            --jq '.[0].url // empty')"

          if [ -z "$issue_url" ]; then
            issue_url="$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "Automated alerts from the intraday paper-trading monitor. This issue is updated only when one or more paper positions are CLOSED.")"
          fi

          closed_lines="$(grep '^CLOSED ' intraday_monitor.log || true)"
          timestamp="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          body="## Paper trade closure detected\n\n**Detected:** $timestamp\n\n**Closed this cycle:** ${{ steps.monitor.outputs.closed_count }}\n\n### Trades\n\n\`\`\`text\n$closed_lines\n\`\`\`\n\nThe full signal snapshot remains stored in SQLite and is preserved for Trade Analysis / Performance Report."

          gh issue comment "$issue_url" --body "$body"

      - name: Persist paper portfolio database if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/stock_scout.db

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "chore: update intraday paper portfolio state"
          git push origin HEAD:main
