name: stock-scout-dashboard

on:
  workflow_dispatch:

  # Aggiornamento dopo l'ingresso del mattino e dopo il ciclo EOD.
  workflow_run:
    workflows:
      - morning-entry
      - paper-trading
    types: [completed]

  # Aggiornamento intraday indipendente dal monitor di trading.
  # Il monitor continua ogni 5 minuti; il dashboard viene ricostruito
  # meno frequentemente per non appesantire il sistema.
  schedule:
    - cron: "0,30 10-15 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 16 * * 1-5"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: stock-scout-ai-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run: esegui solo se il workflow che ha generato
    # l'evento è terminato correttamente.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Build dashboard data
        run: |
          python scripts/build_dashboard.py

      - name: Build trade chart data
        run: |
          python scripts/build_trade_charts.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4